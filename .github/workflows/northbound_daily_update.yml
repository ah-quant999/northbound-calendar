name: 北向资金日历每日更新

# 触发方式：
#   - cron: 北京时间 18:10 每个工作日 = UTC 10:10 周一到周五
#   - cron: 北京时间 17:55 每个工作日 = UTC 09:55 周一到周五（双 cron 冗余，防止 GitHub schedule 延迟）
#   - workflow_dispatch: 手动触发
#   说明：比机游共振晚40分钟，确保机游数据已更新后再生成每日洞察
on:
  schedule:
    - cron: '10 10 * * 1-5'
    - cron: '55 9 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '目标日期 (YYYY-MM-DD，留空为今天)'
        required: false
        default: ''
      lookback:
        description: '回刷前N个北向交易日'
        required: false
        default: '2'

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: calendar-pages

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Configure git
        run: |
          git config user.email "afoxli@coze.email"
          git config user.name "afoxli"
          git config core.quotePath false

      - name: Run daily update and push (带冲突重试)
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          LOOKBACK_ARG="--lookback 2"
          if [ -n "${{ github.event.inputs.lookback }}" ]; then
            LOOKBACK_ARG="--lookback ${{ github.event.inputs.lookback }}"
          fi

          MAX_RETRIES=3
          RETRY=0
          while [ $RETRY -lt $MAX_RETRIES ]; do
            echo "=== 第 $((RETRY+1)) 次尝试 ==="

            # 拉取最新代码，确保从最新状态开始
            git fetch origin calendar-pages
            git reset --hard origin/calendar-pages

            # 执行北向日历更新脚本
            python3 scripts/daily_update_northbound_gha.py \
              --html "北向资金日历.html" \
              --repo-dir "." \
              $DATE_ARG \
              $LOOKBACK_ARG \
              2>&1 | tee update_output.log

            # 检查日历是否有变更
            CAL_HAS_CHANGES=false
            TARGET_DATE=""
            if grep -q "GHA_HAS_CHANGES=true" update_output.log; then
              CAL_HAS_CHANGES=true
              TARGET_DATE=$(grep "GHA_TARGET_DATE=" update_output.log | tail -1 | sed 's/GHA_TARGET_DATE=//')
              echo "📅 北向日历更新，目标日期: $TARGET_DATE"
            else
              echo "ℹ️  北向日历无数据变更"
              # 没有目标日期时用今天
              TARGET_DATE=$(date +"%Y-%m-%d")
            fi

            # 执行北向龙虎榜追踪更新
            echo "📊 更新北向龙虎榜追踪页面 ..."
            python3 scripts/northbound_lhb_tracker.py \
              --repo-dir "." \
              --lookback 2 \
              2>&1 | tee lhb_output.log

            LHB_HAS_CHANGES=false
            if grep -q "GHA_HAS_CHANGES=true" lhb_output.log; then
              LHB_HAS_CHANGES=true
              echo "📊 北向龙虎榜追踪有新数据"
            else
              echo "ℹ️  北向龙虎榜追踪无新数据"
            fi

            # 如果两者都没有变更，跳过提交
            if [ "$CAL_HAS_CHANGES" = false ] && [ "$LHB_HAS_CHANGES" = false ]; then
              echo "ℹ️  北向日历+龙虎榜追踪均无数据变更，跳过提交"
              exit 0
            fi

            echo "📅 目标日期: $TARGET_DATE"

            # 执行三个回测（北向行业+共振+大牛股猎手）
            echo "📈 开始回测更新（北向行业+共振+大牛股猎手）..."
            
            # 北向行业回测
            echo "🏁 北向行业回测 ..."
            python3 scripts/backtest_northbound.py 2>&1 | tee bt_nb.log
            python3 scripts/generate_northbound_backtest_page.py
            
            # 共振回测
            echo "🏁 共振回测 ..."
            python3 scripts/backtest_resonance.py --cache-dir .backtest_cache 2>&1 | tee bt_res.log
            
            # 大牛股猎手回测
            echo "🏁 大牛股猎手回测 ..."
            python3 scripts/backtest_bull_hunter.py 2>&1 | tee bt_bh.log
            python3 scripts/generate_bull_hunter_backtest_page.py
            
            # 一次性提交所有变更（北向日历+龙虎榜+回测）
            echo "📦 汇总所有变更并提交..."
            echo "当前变更文件："
            git status --short
            
            # add 所有已跟踪文件的变更 + 新增的回测数据/页面
            git add -u
            git add data/ *.html .backtest_cache/ 2>/dev/null || true
            
            echo "暂存区状态："
            git diff --cached --stat
            
            if ! git diff --cached --quiet; then
              git commit -m "auto: $TARGET_DATE 北向资金日历+龙虎榜+回测每日更新 (GHA)"
              echo "✅ 提交成功"
            else
              echo "ℹ️  暂存区无变更，跳过提交"
              exit 0
            fi

            # 推送
            if git push origin calendar-pages; then
              echo "✅ 已推送到 calendar-pages 分支"
              exit 0
            else
              echo "⚠️  推送失败，可能有并发冲突，准备重试..."
              git reset --hard HEAD~1
              RETRY=$((RETRY+1))
              sleep $((RETRY * 10))
            fi
          done

          echo "❌ 重试 $MAX_RETRIES 次后仍然失败"
          exit 1

