name: 回测页面每周更新

# 触发方式：
#   - cron: 北京时间 每周日 08:00 = UTC 00:00 周日
#   - workflow_dispatch: 手动触发
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      start:
        description: '回测起始日期 (YYYY-MM-DD，留空使用默认值)'
        required: false
        default: ''
      end:
        description: '回测结束日期 (YYYY-MM-DD，留空使用默认值)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: calendar-pages

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Configure git
        run: |
          git config user.email "afoxli@coze.email"
          git config user.name "afoxli"
          git config core.quotePath false

      - name: Run weekly backtest update and push (带冲突重试)
        run: |
          START_ARG=""
          if [ -n "${{ github.event.inputs.start }}" ]; then
            START_ARG="--start ${{ github.event.inputs.start }}"
          fi
          END_ARG=""
          if [ -n "${{ github.event.inputs.end }}" ]; then
            END_ARG="--end ${{ github.event.inputs.end }}"
          fi

          MAX_RETRIES=3
          RETRY=0
          while [ $RETRY -lt $MAX_RETRIES ]; do
            echo "=== 第 $((RETRY+1)) 次尝试 ==="

            # 拉取最新代码，确保从最新状态开始
            git fetch origin calendar-pages
            git reset --hard origin/calendar-pages

            # 执行北向回测
            echo "🏁 开始北向回测计算 ..."
            python3 scripts/backtest_northbound.py \
              $START_ARG \
              $END_ARG \
              2>&1 | tee backtest_nb.log
            echo "🏁 北向回测完成，生成页面 ..."
            python3 scripts/generate_northbound_backtest_page.py

            # 执行共振回测
            echo "🏁 开始共振回测计算 ..."
            python3 scripts/backtest_resonance.py \
              --cache-dir .backtest_cache \
              $START_ARG \
              $END_ARG \
              2>&1 | tee backtest_res.log

            # 执行大牛股猎手回测
            echo "🏁 开始大牛股猎手回测计算 ..."
            python3 scripts/backtest_bull_hunter.py \
              $START_ARG \
              $END_ARG \
              2>&1 | tee backtest_bh.log
            echo "🏁 大牛股猎手回测完成，生成页面 ..."
            python3 scripts/generate_bull_hunter_backtest_page.py

            # 检查是否有变更（回测页面每周都视为有变更，直接提交）
            if git diff --quiet -- northbound-backtest.html resonance-backtest.html bull-hunter-backtest.html data/northbound_backtest.json data/backtest_result.json data/bull_hunter_backtest.json 2>/dev/null; then
              echo "ℹ️  回测数据未发生变化"
            fi

            # 提交（git diff逐文件add，避开中文文件名编码问题）
            git diff --name-only | while read f; do git add "$f"; done
            # 新增的文件也要add
            git add data/northbound_backtest.json data/backtest_result.json data/bull_hunter_backtest.json northbound-backtest.html resonance-backtest.html bull-hunter-backtest.html 2>/dev/null

            if git diff --cached --quiet; then
              echo "ℹ️  无任何变更，跳过提交"
              exit 0
            fi

            WEEK_DATE=$(date +"%Y-%m-%d")
            git commit -m "auto: $WEEK_DATE 回测页面周更（北向+共振+大牛股猎手）"

            # 推送
            if git push origin calendar-pages; then
              echo "✅ 已推送到 calendar-pages 分支"
              exit 0
            else
              echo "⚠️  推送失败，可能有并发冲突，准备重试..."
              git reset --hard HEAD~1
              RETRY=$((RETRY+1))
              sleep $((RETRY * 10))
            fi
          done

          echo "❌ 重试 $MAX_RETRIES 次后仍然失败"
          exit 1
