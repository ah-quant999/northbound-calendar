<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九宝日历精选</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0d1117;
            min-height: 100vh;
            color: #c9d1d9;
        }

        /* ===== 密码保护 ===== */
        .__pwd-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #0d1117;
            z-index: 2147483647;
            display: flex; align-items: center; justify-content: center;
        }
        .__pwd-box {
            background: #161b22;
            border-radius: 16px;
            border: 1px solid #e888a066;
            padding: 36px 32px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 8px 32px #e888a022;
        }
        .__pwd-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #e888a0, #e888a0aa);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; margin: 0 auto 12px;
        }
        .__pwd-title { font-size: 18px; color: #c9d1d9; font-weight: 600; margin-bottom: 4px; }
        .__pwd-sub { color: #6e7681; font-size: 12px; margin-bottom: 20px; }
        .__pwd-input {
            width: 100%; padding: 10px 14px;
            background: #0d1117;
            border: 1.5px solid #30363d;
            border-radius: 8px; color: #c9d1d9;
            font-size: 14px; outline: none;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .__pwd-input:focus { border-color: #e888a0; box-shadow: 0 0 0 3px #e888a022; }
        .__pwd-btn {
            width: 100%; padding: 10px;
            background: linear-gradient(135deg, #e888a0, #e888a0cc);
            border: none; border-radius: 8px;
            color: #fff; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .__pwd-btn:hover { opacity: 0.9; }
        .__pwd-err { color: #f85149; font-size: 12px; margin-top: 8px; display: none; }
        .__pwd-hint { color: #6e7681; font-size: 11px; margin-top: 12px; }

        /* ===== 主内容 ===== */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            display: none;
        }
        .main-container.show { display: block; }

        .page-title {
            text-align: center;
            margin-bottom: 50px;
        }
        .page-title h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #e8a0b0, #ffd1b5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        .page-title p {
            color: #6e7681;
            font-size: 14px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .nav-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 28px 24px;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s ease;
            cursor: pointer;
            display: block;
        }
        .nav-card:hover {
            border-color: #e888a088;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px #e888a015;
        }

        .nav-card .card-icon {
            width: 48px; height: 48px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
        }
        .nav-card.northbound .card-icon { background: linear-gradient(135deg, #58a6ff, #388bfd); }
        .nav-card.jiyou .card-icon { background: linear-gradient(135deg, #ffd700, #ffb700); color: #0d1117; }
        .nav-card.insight .card-icon { background: linear-gradient(135deg, #f0883e, #d4a72c); }
        .nav-card.important .card-icon { background: linear-gradient(135deg, #a371f7, #8957e5); }
        .nav-card.analysis .card-icon { background: linear-gradient(135deg, #3fb950, #2ea043); }
        .nav-card.backtest .card-icon { background: linear-gradient(135deg, #f85149, #da3633); }

        .nav-card h3 {
            font-size: 17px;
            font-weight: 600;
            color: #e6edf3;
            margin-bottom: 8px;
        }
        .nav-card p {
            font-size: 13px;
            color: #6e7681;
            line-height: 1.6;
        }

        .section-label {
            font-size: 13px;
            color: #6e7681;
            margin-bottom: 12px;
            padding-left: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-label::before {
            content: '';
            width: 3px; height: 16px;
            background: #e8a0b0;
            border-radius: 2px;
        }

        .footer {
            text-align: center;
            padding-top: 30px;
            border-top: 1px solid #21262d;
            color: #484f58;
            font-size: 12px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

<!-- 密码保护 -->
<div class="__pwd-overlay" id="__pwdOverlay">
    <div class="__pwd-box">
        <div class="__pwd-icon">&#128274;</div>
        <div class="__pwd-title">访问验证</div>
        <div class="__pwd-sub">请输入密码</div>
        <input type="password" class="__pwd-input" id="__pwdInput" placeholder="请输入访问密码" autocomplete="off"
               onkeydown="if(event.key==='Enter')__pwdVerify()">
        <button class="__pwd-btn" onclick="__pwdVerify()">进入</button>
        <div class="__pwd-err" id="__pwdError">密码错误，请重试</div>
        <div class="__pwd-hint">7天内免输入 · 全站通用</div>
    </div>
</div>

<!-- 主内容 -->
<div class="main-container" id="mainContent">
    <div class="page-title">
        <h1>九宝日历精选</h1>
        <p>阿狸咪量化 · 数据追踪平台</p>
    </div>

    <div class="section-label">核心日历</div>
    <div class="card-grid">
        <a href="northbound-analysis.html" class="nav-card northbound">
            <div class="card-icon">&#x1F4CA;</div>
            <h3>北向资金日历</h3>
            <p>北向席位追踪、行业流向、连买信号</p>
        </a>
        <a href="jiyou-resonance.html" class="nav-card jiyou">
            <div class="card-icon">&#9889;</div>
            <h3>机游共振日历</h3>
            <p>龙虎榜机构+游资席位共振信号追踪</p>
        </a>
    </div>

    <div class="section-label">每日洞察</div>
    <div class="card-grid">
        <a href="daily-insight.html" class="nav-card insight">
            <div class="card-icon">&#x1F52E;</div>
            <h3>每日市场洞察</h3>
            <p>精选信号汇总、大牛股猎手、异动追踪</p>
        </a>
    </div>

    <div class="section-label">分析工具</div>
    <div class="card-grid">
        <a href="jiyou-signal-analysis.html" class="nav-card analysis">
            <div class="card-icon">&#x1F4C8;</div>
            <h3>机游信号分析</h3>
            <p>连续追踪、信号强度、板块分布</p>
        </a>
        <a href="resonance-backtest.html" class="nav-card backtest">
            <div class="card-icon">&#x1F4CA;</div>
            <h3>共振回测</h3>
            <p>机游共振策略历史回测</p>
        </a>
        <a href="northbound-industry-backtest.html" class="nav-card backtest">
            <div class="card-icon">&#x1F3E2;</div>
            <h3>北向行业回测</h3>
            <p>北向资金行业轮动回测</p>
        </a>
    </div>

    <div class="footer">
        数据来源：东方财富龙虎榜API · 港交所 · 证券时报<br>
        仅供参考，不构成投资建议
    </div>
</div>

<script>
(function(){
    var PWD = "hjd666";
    var KEY = "portal_login_expire";
    var DAYS = 7;

    function ok() {
        try {
            var t = parseInt(localStorage.getItem(KEY) || "0", 10);
            if (t > Date.now()) return true;
            if (sessionStorage.getItem("portal_role") === "1") return true;
        } catch(e) {}
        return false;
    }

    function setOk() {
        try {
            var t = Date.now() + DAYS * 86400000;
            localStorage.setItem(KEY, String(t));
            sessionStorage.setItem("portal_role", "1");
        } catch(e) {}
    }

    function showMain() {
        var o = document.getElementById("__pwdOverlay");
        if (o) o.style.display = "none";
        var m = document.getElementById("mainContent");
        if (m) m.classList.add("show");
    }

    window.__pwdVerify = function() {
        var inp = document.getElementById("__pwdInput");
        var err = document.getElementById("__pwdError");
        var v = inp ? inp.value : "";
        if (v === PWD) {
            setOk();
            showMain();
        } else {
            if (err) err.style.display = "block";
            if (inp) { inp.focus(); inp.select(); }
        }
    };

    function init() {
        if (ok()) {
            showMain();
            return;
        }
        setTimeout(function(){
            var i = document.getElementById("__pwdInput");
            if (i) i.focus();
        }, 50);
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
